<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>Nota Dinas ND-92/PEE/2026 (Revisi)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --black:#080808; --black-3:#1C1C1C; --gold:#C9A84C; --gold-light:#E4C97E; --gold-dim:#8B6914; --cream:#F5EDD6; --cream-dim:#B8A98A; }
    body { background: var(--black); color: var(--cream); font-family: 'Inter', sans-serif; line-height: 1.7; min-height: 100vh; display: flex; flex-direction: column; }
    header { display: flex; align-items: center; gap: 12px; padding: 20px 32px; border-bottom: 1px solid rgba(201,168,76,0.15); }
    header img { width: 44px; height: 44px; object-fit: contain; }
    .brand { font-family: 'Playfair Display', Georgia, serif; font-size: 14px; color: var(--gold); line-height: 1.3; }
    main { flex: 1; width: 100%; max-width: 960px; margin: 0 auto; padding: 56px 24px; }
    .label { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); margin-bottom: 12px; }
    h1 { font-family: 'Playfair Display', Georgia, serif; font-size: clamp(26px, 4vw, 40px); color: #fff; line-height: 1.2; }
    h1 em { color: var(--gold); }
    .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0 32px; }
    .divider i { width: 8px; height: 8px; background: var(--gold); transform: rotate(45deg); }
    .divider span { width: 80px; height: 1px; background: linear-gradient(to right, var(--gold), transparent); }
    .actions { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 32px; }
    .btn { display: inline-block; padding: 13px 28px; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 500; text-decoration: none; border: 1px solid var(--gold); transition: background .3s, color .3s; }
    .btn-primary { background: var(--gold); color: var(--black); }
    .btn-primary:hover { background: var(--gold-light); }
    .btn-secondary { color: var(--gold); }
    .btn-secondary:hover { background: var(--gold); color: var(--black); }
    .viewer { width: 100%; height: 78vh; border: 1px solid rgba(201,168,76,0.25); background: var(--black-3); }
    footer { padding: 24px; text-align: center; font-size: 11px; color: var(--cream-dim); border-top: 1px solid rgba(255,255,255,0.06); }
    @media (max-width: 768px) { header { padding: 16px 24px; } main { padding: 40px 24px; } .viewer { display: none; } .btn { width: 100%; text-align: center; } }
  </style>
</head>
<body>
  <header>
    <img src="images.png" alt="PT Artha Panuntun Masadepanku" />
    <div class="brand">PT Artha Panuntun<br>Masadepanku</div>
  </header>
  <main>
    <div class="label">Dokumen</div>
    <h1>Nota Dinas <em>ND-92/PEE/2026</em> (Revisi)</h1>
    <div class="divider"><i></i><span></span></div>
    <div class="actions">
      <a class="btn btn-primary" href="berkas-f0ac5227c0/nota_dinas_ND-92_PEE_2026_revisi.pdf" target="_blank" rel="noopener">Buka PDF</a>
      <a class="btn btn-secondary" href="berkas-f0ac5227c0/nota_dinas_ND-92_PEE_2026_revisi.pdf" download>Unduh</a>
    </div>
    <iframe class="viewer" src="berkas-f0ac5227c0/nota_dinas_ND-92_PEE_2026_revisi.pdf" title="Nota Dinas ND-92/PEE/2026 (Revisi)"></iframe>
  </main>
  <footer>© PT Artha Panuntun Masadepanku</footer>
</body>
</html>
